<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Горячие клавиши</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e8e8e8; user-select: none; }

    .panel {
      width: 100%; height: 100%;
      background: rgba(10, 12, 20, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      backdrop-filter: blur(24px);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      -webkit-app-region: drag;
      font-size: 11px; font-weight: 700; color: #888;
      letter-spacing: 0.5px; text-transform: uppercase;
    }

    .close {
      -webkit-app-region: no-drag;
      background: none; border: none; color: #555; cursor: pointer;
      font-size: 14px; padding: 2px 6px; border-radius: 4px;
    }
    .close:hover { color: #aaa; background: rgba(255,255,255,0.07); }

    .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 8px; background: rgba(255,255,255,0.02);
      border-radius: 6px;
    }
    .row span:first-child { color: #aaa; font-size: 12px; }

    kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px; padding: 2px 7px;
      font-family: inherit; font-size: 11px; color: #ccc;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <span>Горячие клавиши</span>
      <button class="close" id="close">✕</button>
    </div>
    <div class="body">
      <div class="row"><span>Старт / стоп записи</span> <kbd>Ctrl + Shift + R</kbd></div>
      <div class="row"><span>Скрыть / показать окно</span> <kbd>Ctrl + Shift + H</kbd></div>
      <div class="row"><span>Очистить</span> <kbd>Ctrl + Shift + C</kbd></div>
    </div>
  </div>
  <script>
    document.getElementById('close').addEventListener('click', () => window.close());
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
  </script>
</body>
</html>
